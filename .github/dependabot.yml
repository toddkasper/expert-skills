# GitHub Actions version updates, grouped into one PR a week (sysadmin finding 28, 2026-10-30).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
      github-actions:
        patterns: ["*"]
